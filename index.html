<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Particle Chaos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:active, .btn.active {
      background: rgba(255,255,255,0.35);
      transform: scale(0.95);
    }
    #mode-label {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #particle-count {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="mode-label">Attract</div>
  <div id="particle-count"></div>
  <div id="ui">
    <button class="btn" id="mode-btn">Mode</button>
    <button class="btn" id="spawn-btn">Spawn</button>
    <button class="btn" id="clear-btn">Clear</button>
    <button class="btn" id="gravity-btn">Gravity</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
